# trufflecheck baseline cargo-deny policy (cargo-deny >= 0.20.2) for Elide's Cargo workspaces.
#
# cargo-deny cannot include another file, so each repository copies this file to its root and adds only what is its
# own: `[sources] allow-git` forks, `[advisories] ignore` entries, `[bans] skip`/`deny` wrappers and licence
# exceptions, each with an inline justification. Keep the rest identical to this file.

[graph]
# Optional features ship too; check their dependency graph with the default one.
all-features = true
# Restrict to the platforms you ship, so licences and bans aren't checked for targets you never build, e.g.:
# targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
# Unsound advisories anywhere in the graph; unmaintained ones for direct dependencies.
unsound = "all"
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.9
# The baseline lists licences acceptable across Elide's binaries; most workspaces use a subset.
unused-allowed-license = "allow"
# Permissive licences, plus MPL-2.0 (file-level copyleft: modified MPL files stay MPL). Add to a repository's copy
# only with a justification.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Skip licence checks for workspace crates marked `publish = false`.
ignore = true

[bans]
# Duplicates are visible by default; a repository that has converged its graph should raise this to "deny" and list
# remaining duplicates under `skip` with reasons.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = []
deny = []
