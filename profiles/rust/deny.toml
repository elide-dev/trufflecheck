# trufflecheck baseline cargo-deny policy (cargo-deny >= 0.20.2) for Elide's Cargo workspaces.
#
# cargo-deny cannot include another file, so each repository copies this file to its root and adds only what is its
# own: `[sources] allow-git` forks, `[advisories] ignore` entries, `[bans] skip`/`deny` wrappers and licence
# exceptions, each with an inline justification. Keep the shared sections identical to this file;
# a diff against this file in CI catches drift.

[graph]
# Optional features ship too; check their dependency graph with the default one.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences acceptable in Elide's binaries. Add to a repository's copy only with a justification.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Unpublished workspace crates carry no licence field.
ignore = true

[bans]
# Duplicates are visible by default; a repository that has converged its graph should raise this to "deny" and list
# remaining duplicates under `skip` with reasons.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = []
deny = []
