# trufflecheck default policy. Projects overlay this with their own properties file; see Policy.java.
# `<rule>` lists owners (`Type` or `Type#method`), `<rule>.scope` lists packages, `<rule>.message` is the diagnostic.

stackful=java.lang.Throwable,java.lang.Exception,java.lang.RuntimeException,java.lang.Error,java.lang.IllegalArgumentException,java.lang.IllegalStateException,java.lang.UnsupportedOperationException,java.lang.NullPointerException,java.lang.IndexOutOfBoundsException,java.io.IOException,java.util.NoSuchElementException
stackful.message=This constructor captures a stack. Use a stackless exception or suppress TruffleStackfulException for a diagnostic path.

collections=java.util.LinkedList,java.util.Vector,java.util.Hashtable,java.util.Stack
collections.message=This collection is prohibited. Prefer an array-backed collection or justify a local TruffleForbiddenCollection suppression.

# Guest-implementation packages that must not touch the embedding API. Empty by default: set `hostinterop.scope`
# to your language's packages (e.g. `dev.elide.komodo`) to activate TruffleHostInterop.
hostinterop=org.graalvm.polyglot
hostinterop.scope=
hostinterop.message=Guest implementations must not use the polyglot embedding API (Value, Context, Proxy*). Export a TruffleObject with @ExportLibrary, or move the call to the embedding boundary.

blocking=java.lang.ThreadLocal#get,java.lang.ThreadLocal#set,java.lang.ThreadLocal#remove,java.lang.Object#wait,java.lang.Thread#sleep,java.util.concurrent.locks.Lock#lock,java.util.concurrent.locks.Lock#lockInterruptibly,java.util.concurrent.CompletableFuture#join,java.util.concurrent.Future#get
blocking.message=Synchronization, thread-locals and blocking calls in a Truffle node must sit behind @TruffleBoundary.

hostvalue=java.lang.System#getenv,java.lang.System#getProperty,java.lang.System#getProperties,java.lang.System#currentTimeMillis,java.lang.System#nanoTime,java.time.Instant#now,java.time.LocalDate#now,java.time.LocalDateTime#now,java.time.LocalTime#now,java.time.OffsetDateTime#now,java.time.ZonedDateTime#now,java.time.Clock#systemUTC,java.time.Clock#systemDefaultZone,java.time.ZoneId#systemDefault,java.util.TimeZone#getDefault,java.util.Locale#getDefault,java.nio.charset.Charset#defaultCharset,java.nio.file.FileSystems#getDefault,java.lang.Runtime#availableProcessors,java.lang.Runtime#maxMemory,java.lang.ProcessHandle#current,java.lang.ProcessHandle#pid,java.net.InetAddress#getLocalHost
hostvalue.message=This static initializer runs at image build time and seals a build-host value into the image heap. Read it lazily at run time or initialize the class at run time.

compilationfinal.message=@CompilationFinal on an array field must declare dimensions; the default treats only the reference as constant.

children.message=Without the annotation the node is not adopted and partial evaluation cannot treat it as constant; passing the frame into its call aborts compilation.

# Native Image class-init lists (paths relative to the overlay file). Empty by default, which leaves
# TruffleHostValueInImageHeap inactive: nothing is known to initialize at build time.
classinit.buildtime=
classinit.runtime=
