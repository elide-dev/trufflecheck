# trufflecheck default policy. Projects overlay this with their own properties file; see Policy.java.
# `<rule>` lists owners (types, packages, or `Type#method` / `Type#<init>` call entries), `<rule>.scope` lists
# packages, `<rule>.exclude` is a regex on source paths the rule skips, `<rule>.message` is the diagnostic.

# TruffleStackfulException. Library exceptions (these packages) are flagged where they're created; project exception
# types are flagged where they're declared, if they extend a stackful library exception without opting out.
stackful.library=java,javax,jdk,kotlin
# Supertypes that make an exception stackless (or capture lazily, as Truffle's guest exceptions do).
stackful.exempt=com.oracle.truffle.api.nodes.ControlFlowException,com.oracle.truffle.api.nodes.SlowPathException,com.oracle.truffle.api.exception.AbstractTruffleException
# Kotlin stdlib functions that throw stackful exceptions (detekt only).
stackful.kotlin=kotlin.error,kotlin.check,kotlin.checkNotNull,kotlin.require,kotlin.requireNotNull,kotlin.TODO
stackful.exclude=.*/(test|tests|testFixtures|testing)/.*
stackful.message=Filling in a stack trace walks the stack (and Throwable.fillInStackTrace is on Native Image's runtime-compilation blocklist). Use a stackless exception (override fillInStackTrace, or pass writableStackTrace = false), a Truffle exception type, or suppress TruffleStackfulException on a diagnostic path.

collections=java.util.LinkedList,java.util.Vector,java.util.Hashtable,java.util.Stack,java.lang.StringBuffer
collections.message=This type is prohibited: linked or synchronized on every operation, and on Native Image's runtime-compilation blocklist. Prefer an array-backed collection (or StringBuilder), or justify a local TruffleForbiddenCollection suppression.

# Guest-implementation packages that must not touch the embedding API. Empty by default: set `hostinterop.scope`
# to your language's packages (e.g. `dev.elide.komodo`) to activate TruffleHostInterop.
hostinterop=org.graalvm.polyglot
hostinterop.scope=
# Embedding-API types guest code legitimately names (language registration, source content).
hostinterop.allow=org.graalvm.polyglot.SandboxPolicy,org.graalvm.polyglot.io.ByteSequence
hostinterop.message=Guest implementations must not use the polyglot embedding API (Value, Context, Proxy*). Export a TruffleObject with @ExportLibrary, or move the call to the embedding boundary.

blocking=java.lang.ThreadLocal#get,java.lang.ThreadLocal#set,java.lang.ThreadLocal#remove,java.lang.Object#wait,java.lang.Object#notify,java.lang.Object#notifyAll,java.lang.Thread#sleep,java.lang.Thread#join,java.util.concurrent.locks.Lock#lock,java.util.concurrent.locks.Lock#lockInterruptibly,java.util.concurrent.locks.Lock#tryLock,java.util.concurrent.locks.Condition#await,java.util.concurrent.locks.Condition#awaitNanos,java.util.concurrent.locks.Condition#awaitUninterruptibly,java.util.concurrent.locks.LockSupport#park,java.util.concurrent.locks.LockSupport#parkNanos,java.util.concurrent.locks.LockSupport#parkUntil,java.util.concurrent.CompletableFuture#join,java.util.concurrent.Future#get,java.util.concurrent.CountDownLatch#await,java.util.concurrent.Semaphore#acquire,java.util.concurrent.Semaphore#acquireUninterruptibly,java.util.concurrent.BlockingQueue#take,java.util.concurrent.BlockingQueue#put
blocking.message=Synchronization, thread-locals and blocking calls reachable by partial evaluation must sit behind @TruffleBoundary (or after transferToInterpreter); Native Image's runtime-compilation blocklist rejects lock methods outright. Guest-visible blocking should go through TruffleSafepoint.setBlocked(…).

hostvalue=java.lang.System#getenv,java.lang.System#getProperty,java.lang.System#getProperties,java.lang.System#currentTimeMillis,java.lang.System#nanoTime,java.lang.System#lineSeparator,java.lang.System#identityHashCode,java.time.Instant#now,java.time.LocalDate#now,java.time.LocalDateTime#now,java.time.LocalTime#now,java.time.OffsetDateTime#now,java.time.ZonedDateTime#now,java.time.Clock#systemUTC,java.time.Clock#systemDefaultZone,java.time.ZoneId#systemDefault,java.util.TimeZone#getDefault,java.util.Locale#getDefault,java.nio.charset.Charset#defaultCharset,java.nio.file.FileSystems#getDefault,java.nio.file.Path#toAbsolutePath,java.nio.file.Path#toRealPath,java.io.File#getAbsolutePath,java.io.File#getCanonicalPath,java.lang.Runtime#availableProcessors,java.lang.Runtime#maxMemory,java.lang.Runtime#totalMemory,java.lang.Runtime#freeMemory,java.lang.ProcessHandle#current,java.lang.ProcessHandle#pid,java.lang.Thread#currentThread,java.net.InetAddress#getLocalHost,java.lang.Math#random,java.util.UUID#randomUUID,java.util.concurrent.ThreadLocalRandom#current,java.lang.ClassLoader#getSystemClassLoader,java.util.ServiceLoader#load,java.nio.ByteBuffer#allocateDirect,java.util.Random#<init>,java.util.SplittableRandom#<init>,java.lang.Thread#<init>,java.io.FileInputStream#<init>,java.io.FileOutputStream#<init>,java.io.RandomAccessFile#<init>,java.util.zip.ZipFile#<init>,kotlin.random.Random#nextInt,kotlin.random.Random#nextLong,kotlin.random.Random#nextDouble,kotlin.time.TimeSource.Monotonic#markNow
hostvalue.message=This static initializer runs at image build time and seals a build-host value into the image heap. Read it lazily at run time or initialize the class at run time.

compilationfinal.message=@CompilationFinal on an array field must declare dimensions. Omitted, it defaults to the array's full depth: every element is folded as a constant, so elements written later without invalidation leave stale code. State the depth you mean (0 = only the reference).

children.message=Without the annotation the node is not adopted and partial evaluation cannot treat it as constant; passing the frame into its call aborts compilation.

# TruffleCompilationFinalWrite.
cfwrite.message=Compiled code has folded the old value: call CompilerDirectives.transferToInterpreterAndInvalidate() (or invalidate an Assumption) before changing it.

# TruffleMissingBoundary. By default, Native Image's runtime-compilation blocklist (TruffleFeature.initializeMethodBlocklist,
# GraalVM 25.5), which fails the image build when these are reachable from runtime-compiled code, plus other PE-hostile
# APIs. Calls match by the resolved method's declaring class. `pkg.*` covers a package. ReentrantLock is left to
# TruffleBlockingInNode.
boundary.types=java.math.BigInteger,java.math.BigDecimal,java.lang.Comparable,java.util.Comparator,java.util.Collection,java.util.List,java.util.Set,java.util.Map,java.util.Map.Entry,java.util.TreeMap,java.util.HashMap,java.util.concurrent.ConcurrentHashMap,java.util.WeakHashMap,java.util.IdentityHashMap,java.lang.Iterable,java.util.Iterator,java.util.ListIterator,java.lang.StringBuffer,java.util.Vector,java.util.Hashtable,java.lang.AssertionError,java.util.function.*,java.util.stream.*,java.util.regex.*,java.lang.reflect.*,java.io.PrintStream,kotlin.collections.Collection,kotlin.collections.MutableCollection,kotlin.collections.List,kotlin.collections.MutableList,kotlin.collections.Set,kotlin.collections.MutableSet,kotlin.collections.Map,kotlin.collections.MutableMap,kotlin.collections.Map.Entry,kotlin.collections.MutableMap.MutableEntry,kotlin.collections.Iterable,kotlin.collections.MutableIterable,kotlin.collections.Iterator,kotlin.collections.MutableIterator,kotlin.collections.ListIterator,kotlin.collections.MutableListIterator,kotlin.Comparable,kotlin.text.Regex,kotlin.sequences.Sequence
boundary.calls=java.lang.Object#toString,java.lang.String#valueOf,java.lang.String#getBytes,java.lang.String#indexOf,java.lang.String#format,java.lang.String#formatted,java.lang.String#split,java.lang.String#replaceAll,java.lang.String#replaceFirst,java.lang.String#matches,java.lang.Throwable#fillInStackTrace,java.lang.Throwable#initCause,java.lang.Throwable#addSuppressed,java.lang.Throwable#printStackTrace,java.lang.Throwable#getStackTrace,java.lang.System#getProperty,java.lang.Class#forName,java.lang.Class#getMethod,java.lang.Class#getDeclaredMethod,java.lang.Class#getField,java.lang.Class#getDeclaredField,java.lang.Class#getConstructor,java.lang.Class#getDeclaredConstructor,kotlin.Any#toString,kotlin.text#format,kotlin.text#toRegex,kotlin.text#split,kotlin.text#replace,kotlin.text#matches,kotlin.io#println,kotlin.io#print
# The blocklist's temporary allowlist (GR-41564) and blocklist exceptions.
boundary.allow=java.util.function.Function#apply,java.util.function.Predicate#test,java.util.List#add,java.util.List#size,java.util.List#isEmpty,java.util.List#clear,java.util.List#get,java.util.List#remove,java.util.List#toArray,java.util.Collection#size,java.util.Collection#isEmpty,java.util.Iterator#next,java.util.Iterator#hasNext,java.lang.Iterable#iterator,java.lang.Object#equals,java.lang.Object#hashCode,java.math.BigInteger#signum,kotlin.collections.List#get,kotlin.collections.MutableList#add,kotlin.collections.MutableList#clear,kotlin.collections.MutableList#remove,kotlin.collections.MutableList#removeAt,kotlin.collections.Collection#isEmpty,kotlin.collections.Iterator#next,kotlin.collections.Iterator#hasNext,kotlin.collections.Iterable#iterator,kotlin.Any#equals,kotlin.Any#hashCode
boundary.message=Call it from a @TruffleBoundary method (or after transferToInterpreter); Native Image's runtime-compilation blocklist rejects these in compiled code, and partial evaluation can't inline them usefully.

# TruffleSkippedException: Graal's skipped exception types (KnownTruffleTypes.createSkippedExceptionTypes, 25.5).
skipped=java.lang.ArithmeticException,java.lang.IllegalArgumentException,java.lang.IllegalStateException,java.lang.IndexOutOfBoundsException,java.lang.ClassCastException,java.lang.AssertionError,java.lang.VirtualMachineError,java.nio.BufferUnderflowException,java.nio.BufferOverflowException,java.nio.ReadOnlyBufferException,com.oracle.truffle.api.nodes.SlowPathException,com.oracle.truffle.api.nodes.UnexpectedResultException
skipped.message=Throwing it always deoptimizes and invalidates, and catching it doesn't help. Throw a guest error (AbstractTruffleException), use a ControlFlowException, or transferToInterpreter first.

# TruffleChildWriteWithoutInsert.
insert.message=Adopt the node with insert(…) (or replace the old one with replace(…)); a bare assignment leaves it without a parent.

# TruffleChildrenLoop.
loop.message=Exploded loops must have partial-evaluation-constant bounds (see truffle/docs/PartialEvaluation.md).

# Native Image class-init lists (paths relative to the overlay file). Empty by default, which leaves
# TruffleHostValueInImageHeap inactive: nothing is known to initialize at build time.
classinit.buildtime=
classinit.runtime=
