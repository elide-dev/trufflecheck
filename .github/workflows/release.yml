# Release Please keeps a release pull request open from Conventional Commits on main. Merging it bumps the versions
# (elide.pkl files, README samples), writes CHANGELOG.md, tags v<version> and creates a *draft* GitHub release. The
# publish job then builds and tests that tag and publishes it:
#   - Maven: dev.elide:trufflecheck-{policy,errorprone,detekt} to https://maven.elide.dev (R2 bucket elide-maven)
#   - Build provenance attestations (Sigstore, via GitHub) for every JAR and the profiles tarball
#   - GitHub release assets: the three JARs, trufflecheck-profiles-<version>.tar.gz and SHA256SUMS
# Publishing the draft comes last: the repository uses immutable releases, so assets and the tag are locked from then on
# and GitHub adds its own release attestation. Publishing credentials live in the `release` environment (main only).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A RELEASE_PLEASE_TOKEN (fine-grained or GitHub App) makes CI run on the release pull request too.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: elide-dev/setup-elide@10fbf30cebffd3538c428369950dc2094137f02b # v4.2.0
        with:
          version: 1.6.4+20261116
          channel: nightly
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Check the release matches every manifest version
        run: |
          for manifest in elide.pkl policy/elide.pkl errorprone/elide.pkl detekt/elide.pkl; do
            grep -qE "^version = \"$VERSION\"( |$)" "$manifest" || { echo "::error::$manifest is not at $VERSION"; exit 1; }
          done

      - name: Build
        run: elide build
      - name: Test
        run: tests/smoke.sh

      - name: Refuse to overwrite a published version
        run: |
          for artifact in trufflecheck-policy trufflecheck-errorprone trufflecheck-detekt; do
            url="https://maven.elide.dev/dev/elide/$artifact/$VERSION/$artifact-$VERSION.pom"
            if curl -fsSI "$url" >/dev/null; then echo "::error::$url already exists"; exit 1; fi
          done

      - name: Stage the Maven repository
        run: |
          # Seed live metadata so the deploy merges into it instead of replacing it.
          for artifact in trufflecheck-policy trufflecheck-errorprone trufflecheck-detekt; do
            dir="build/maven/dev/elide/$artifact"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/maven-metadata.xml" "https://maven.elide.dev/dev/elide/$artifact/maven-metadata.xml" \
              || rm -f "$dir/maven-metadata.xml"
          done
          elide publish --to staging
          # Elide keeps a stale <latest> when merging (elide-dev/runtime#3012): point it at this release.
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, re, sys
          version = sys.argv[1]
          for meta in pathlib.Path("build/maven/dev/elide").glob("*/maven-metadata.xml"):
              text = re.sub(r"<latest>[^<]*</latest>", f"<latest>{version}</latest>", meta.read_text())
              meta.write_text(text)
              for algorithm in ("md5", "sha1", "sha256", "sha512"):
                  digest = hashlib.new(algorithm, text.encode()).hexdigest()
                  meta.with_name(f"{meta.name}.{algorithm}").write_text(digest)
          PY
          find build/maven -type f | sort

      - name: Upload to maven.elide.dev
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff # main @ 2025-12-22
        with:
          path: build/maven/dev/elide
          target: dev/elide
          bucket: elide-maven
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Verify the published artifacts
        run: |
          for artifact in trufflecheck-policy trufflecheck-errorprone trufflecheck-detekt; do
            path="dev/elide/$artifact/$VERSION/$artifact-$VERSION.jar"
            want="$(sha256sum "build/maven/$path" | cut -d' ' -f1)"
            got="$(curl -fsSL "https://maven.elide.dev/$path" | sha256sum | cut -d' ' -f1)"
            [[ "$want" == "$got" ]] || { echo "::error::$path differs from what was uploaded"; exit 1; }
          done

      - name: Assemble release assets
        run: |
          mkdir -p build/release
          for artifact in policy errorprone detekt; do
            cp "build/maven/dev/elide/trufflecheck-$artifact/$VERSION/trufflecheck-$artifact-$VERSION.jar" build/release/
          done
          tar -czf "build/release/trufflecheck-profiles-$VERSION.tar.gz" profiles plugins LICENSE LICENSE-APACHE LICENSE-MIT
          (cd build/release && sha256sum -- *.jar *.tar.gz > SHA256SUMS)

      # The JARs attested here are byte-identical to the ones on maven.elide.dev (checked above).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/*.jar
            build/release/*.tar.gz

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in build/release/*.jar build/release/*.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Attach assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" build/release/* --clobber
          # Last: with immutable releases, publishing locks the assets and tag.
          gh release edit "$TAG" --draft=false --latest
